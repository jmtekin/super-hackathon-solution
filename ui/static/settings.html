<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · BackupAirlock</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%276%27 fill=%27%233fb950%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="airlock.css">
<style>
/* Settings: what the runtime is set to, read from its GET /api/config (no tokens, keys or paths). System: airlock.css. */
/* one panel per section: its name in the panel header, sibling groups (two sources, four targets, two sandboxes) side by side */
#body{display:grid;gap:var(--s5);margin-top:var(--s7)}
.sec{display:grid;grid-template-columns:240px minmax(0,1fr);gap:var(--s6);padding:var(--s5)}
.sec h2{font-size:16px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.sec h2 + p{font-size:13px;line-height:20px;color:var(--ink-2);margin-top:var(--s1)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5) var(--s6)}
.group{min-width:0}
.group h3{font-size:13px;line-height:20px;font-weight:600;padding-bottom:var(--s2);margin-bottom:var(--s2);border-bottom:1px solid var(--line)}
dl{display:grid;grid-template-columns:128px minmax(0,1fr);column-gap:var(--s4);row-gap:6px}
dt{font-size:13px;line-height:20px;color:var(--strong)}
dd{font-size:13px;line-height:20px;overflow-wrap:anywhere}
ul.rules{list-style:none;display:grid;row-gap:6px}
ul.rules li{font-size:13px;line-height:20px}
.err{color:var(--ink-2);font-size:13px}
@media (max-width:900px){
  .sec{grid-template-columns:minmax(0,1fr);gap:var(--s4)}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .sec{padding:var(--s4)}
  dl{grid-template-columns:minmax(0,1fr);row-gap:0}
  dd{margin-bottom:var(--s2)}
}
</style>
</head>
<body>
<header class="appbar">
    <a class="brand" href="overview">BackupAirlock</a>
    <nav class="nav"><a href="overview">Overview</a><a href="timeline">Timeline</a><a href="settings" aria-current="page">Settings</a></nav>
</header>
<div class="page">
  <h1>Settings</h1>
  <p class="lead">Read from the running runtime on Vultr. Changing them means changing its config on the VM.</p>
  <div id="body"></div>
</div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const dl = pairs => `<dl>${pairs.filter(([, v]) => v !== undefined && v !== "").map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
const sec = (title, sub, inner) => `<section class="sec panel"><div><h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ""}</div><div>${inner}</div></section>`;
const cols = inner => `<div class="cols">${inner}</div>`;
const group = (title, inner) => `<div class="group"><h3>${esc(title)}</h3>${inner}</div>`;
const every = s => s >= 60 ? `every ${s / 60} min` : `every ${s} s`;
const sandbox = p => dl([["runtime", p.runtime], ["image", p.image], ["network", p.network], ["root filesystem", p.rootfs],
  ["backup file", p.input], ["data", p.data], ["memory", p.app_memory ? `${p.memory}, app ${p.app_memory}` : p.memory],
  ["CPU", `${p.cpus}, shares ${p.cpu_shares}`], ["processes", `at most ${p.pids_limit}`], ["capabilities", p.capabilities],
  ["runs as", p.user], ["time limit", `${p.timeout_s} s`]]);

fetch("rg/api/config").then(r => r.ok ? r.json() : Promise.reject(r.status)).then(c => {
  document.getElementById("body").innerHTML = [
    sec("Sources", "Backups are only ever read from here.", cols(c.sources.map(s => group(s.site,
      dl([["address", s.url], ["access", s.access], ["checked", every(s.poll_s)]]))).join(""))),
    sec("Restore targets", "Where a backup that passed is restored. Never production.", cols(c.targets.map(t => group(t.site,
      dl([["app version", t.app], ["address", t.url], ["restore", t.restore]]))).join(""))),
    sec("Sandbox", "Every restore runs here first.", cols(group("ERP (MariaDB)", sandbox(c.sandbox.frappe)) + group("Stand-in (Postgres)", sandbox(c.sandbox.postgres)))),
    sec("Heal", "Old backup on a newer app version.", dl([["model", c.bridge.model], ["inference", c.bridge.provider],
      ["attempts", `at most ${c.bridge.max_rounds} rounds, checked after each`]])),
    sec("Business rules", "Checked on every restored copy.", cols(group("ERP", `<ul class="rules">${c.rules.frappe.map(r => `<li>${esc(r)}</li>`).join("")}</ul>`) +
      group("Stand-in", `<ul class="rules">${c.rules["stand-in"].map(r => `<li>${esc(r)}</li>`).join("")}</ul>`))),
  ].join("");
}).catch(() => { document.getElementById("body").innerHTML = `<p class="err">The runtime is not answering, so its settings cannot be shown.</p>`; });
</script>
</body>
</html>
