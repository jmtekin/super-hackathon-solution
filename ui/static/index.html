<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BackupAirlock: which backup restores into which app version</title>
<style>
/* Console: graphite, hairlines, 2-4 px radii, status = small mark + word. One accent (selection, focus, links).
   State hues: ready green, drift / not restorable amber, quarantined red (danger only). Grey = not decided yet.
   Type 12 / 13 / 14 / 16 / 20. Space 4 8 12 16 24 32 48. */
:root{
  --bg:#101418;--surface:#151a1f;--raise:#1b2127;--code:#0c1013;
  --line:#242b32;--line-2:#333c45;--ink:#e3e6ea;--ink-2:#b7bec6;--muted:#879099;
  --ok:#6fbf8e;--warn:#d4a55a;--bad:#e0706a;--accent:#86a9e6;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.page{max-width:1440px;margin:0 auto;padding:24px 48px 48px}

/* header */
.bar{display:flex;align-items:center;gap:24px;height:40px}
.brand{font-weight:600;font-size:14px;letter-spacing:.01em}
.tabs{display:flex;gap:4px}
.tabs button{height:32px;padding:0 12px;border-radius:3px;color:var(--muted);font-size:13px}
.tabs button[aria-selected=true]{color:var(--ink);background:var(--raise)}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.live i{width:6px;height:6px;border-radius:1px;background:var(--line-2)}
.live.on i{background:var(--ok)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:24px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.meta{font-size:12px;color:var(--muted)}
h1{font-size:20px;line-height:28px;font-weight:600;margin-top:4px}
h1 em{font-style:normal;color:var(--bad)}
.actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.btn{height:32px;padding:0 12px;border-radius:3px;font-size:13px;font-weight:600;line-height:30px;border:1px solid var(--line-2);color:var(--ink);white-space:nowrap;display:inline-block}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn:hover{text-decoration:none}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.note:empty{display:none}

/* main grid: matrix 7 columns, panel 5 */
.main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:32px;margin-top:24px;align-items:start}
.colhead{font:11px/16px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-bottom:8px}
.matrix{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);column-gap:8px}
.matrix > .row{display:contents}
.bk{padding:12px 12px 12px 0;border-top:1px solid var(--line);min-width:0}
.bk .name{font:600 13px/20px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk .sub{font-size:12px;color:var(--muted);margin-top:2px}
.bk .v{margin-top:6px;font-size:12px;font-weight:600}
.cell{margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--surface);text-align:left;min-width:0;display:block;width:100%}
.cell{display:flex;flex-direction:column;justify-content:flex-start}
.cell:hover{border-color:var(--line-2)}
.cell[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.st{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;line-height:20px}
.st i{width:8px;height:8px;border-radius:1px;flex-shrink:0;background:var(--c)}
.st i.hollow{background:none;box-shadow:inset 0 0 0 1.5px var(--c)}
.st b{color:var(--c);font-weight:600}
.st span{font-weight:400;color:var(--ink-2)}
.cell .d{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .app{display:none;font:11px/16px var(--mono);color:var(--muted);margin-bottom:4px}
.c-ok{--c:var(--ok)}.c-warn{--c:var(--warn)}.c-bad{--c:var(--bad)}.c-idle{--c:var(--muted)}.c-run{--c:var(--ink)}
.empty{padding:24px 0;color:var(--muted);border-top:1px solid var(--line)}

/* panel */
.panel{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:24px;min-width:0}
.panel h2{font-size:16px;line-height:24px;font-weight:600;overflow-wrap:anywhere}
.panel h2 .mono{font-size:14px}
.panel .lead{margin-top:4px;color:var(--ink-2);font-size:13px}
.panel section{margin-top:24px}
.panel h3{font:11px/16px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.rows > div{display:grid;grid-template-columns:16px minmax(0,1fr) minmax(0,1fr);column-gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:20px}
.rows .m{font-weight:700}
.rows .ok{color:var(--ok)}.rows .no{color:var(--bad)}.rows .warn{color:var(--warn)}
.rows .d{color:var(--muted);overflow-wrap:anywhere}
.rows .n small{color:var(--muted);font-size:12px}
.rows.ev > div{grid-template-columns:48px minmax(0,1fr)}
.rows.ev .t{font:12px/20px var(--mono);color:var(--muted)}
.rows.ev .st{align-items:flex-start;font-weight:400}
.rows.ev .st i{margin-top:6px}
.rows.ev .st .muted{display:block}
.rows.ev span{overflow-wrap:anywhere;min-width:0}
.code{margin-top:8px;background:var(--code);border-radius:3px;padding:12px;font:12px/20px var(--mono);color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto}
.kv{display:grid;grid-template-columns:auto 1fr;column-gap:16px;row-gap:4px;margin-top:8px;font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{font-family:var(--mono);overflow-wrap:anywhere}
.kv.target{margin-top:8px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.links{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:13px}
.timing{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 56px;column-gap:12px;align-items:center;font-size:12px;padding:4px 0}
.timing .s{text-align:right;font-family:var(--mono)}
.timing .b i{display:block;height:4px;border-radius:1px;background:var(--line-2)}
details summary{cursor:pointer;color:var(--accent);font-size:13px;margin-top:12px}
details.grp summary{list-style:none;margin:0}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary h3{color:var(--muted)}
details.grp summary h3 b{color:var(--ok);font-weight:400}

/* certificate */
.cert{max-width:880px;margin-top:24px}
.cert .head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.cert h2{font-size:20px;line-height:28px;font-weight:600}
.cert table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.cert th{font:11px/16px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line-2)}
.cert td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.cert section{margin-top:32px}
.cert .stamp{font-size:13px;margin-top:4px}

@media (max-width:900px){
  .page{padding:16px}
  .bar{gap:12px}
  .live span{display:none}
  .top{display:block}
  .actions{margin-top:16px;flex-wrap:wrap}
  h1{font-size:18px;line-height:26px}
  .main{display:block}
  .matrix{grid-template-columns:1fr 1fr}
  .matrix > .colhead{display:none}
  .cell .app{display:block}
  .cell .d{white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  .bk{grid-column:1 / 3;padding:12px 0 0}
  .cell{margin:8px 0 4px}
  .panel{margin-top:24px;padding:16px}
  .rows > div{grid-template-columns:16px minmax(0,1fr)}
  .rows .d{grid-column:2}
  .cert .head{display:block}
  .cert .head .actions{margin-top:12px}
  .cert table,.cert tbody,.cert tr,.cert td{display:block}
  .cert tr:first-child{display:none}
  .cert tr{padding:8px 0;border-bottom:1px solid var(--line)}
  .cert td{border:0;padding:2px 0;overflow-wrap:anywhere}
  .cert td:empty{display:none}
  .timing{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 48px}
}
@media print{
  :root{--bg:#fff;--surface:#fff;--raise:#fff;--code:#f4f4f2;--line:#ddd;--line-2:#bbb;--ink:#111;--ink-2:#333;--muted:#555;--ok:#1d6b3e;--warn:#7a5200;--bad:#a3201a;--accent:#111}
  .bar,.top,.no-print{display:none}
  .page{padding:0}
}
</style>
</head>
<body>
<div class="page">
  <div class="bar">
    <span class="brand">BackupAirlock</span>
    <div class="tabs" role="tablist">
      <button role="tab" data-view="backups">Backups</button>
      <button role="tab" data-view="drill">Drill</button>
    </div>
    <div class="live" id="live"><i></i><span>offline</span></div>
  </div>
  <div class="top">
    <div style="min-width:0">
      <div class="meta" id="meta"></div>
      <h1 id="headline">Loading</h1>
    </div>
    <div class="actions" id="actions"></div>
  </div>
  <div class="note" id="note"></div>
  <div id="body"></div>
</div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const mb = n => n == null ? "" : (n / 1048576).toFixed(n < 10485760 ? 2 : 1) + " MB";
const sec = s => s == null ? "" : `${(+s).toFixed(1)} s`;
const clock = d => new Date(d).toLocaleString("en-GB", {timeZone: "Europe/Stockholm", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
const getJSON = async u => { const r = await fetch(u); if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 120)}`); return r.json(); };

// One vocabulary for both engines. Healed is ready (it restores, with the bridge); red is only ever quarantine.
const STATES = {
  native:      ["c-ok",   "Ready", "native"],
  healed:      ["c-ok",   "Ready", "healed"],
  drift:       ["c-warn", "Drift", ""],
  healing:     ["c-warn", "Drift", "healing"],
  failed:      ["c-warn", "Not restorable", ""],
  quarantined: ["c-bad",  "Quarantined", ""],
  running:     ["c-run",  "Running", "", true],
  queued:      ["c-idle", "Queued", "", true],
  not_run:     ["c-idle", "Not run", "", true],
};
const VERDICTS = {
  ready: ["c-ok", "DR ready"], dr_ready: ["c-ok", "DR ready"], quarantined: ["c-bad", "Quarantined, do not restore"],
  not_restorable: ["c-warn", "Not restorable"], failed: ["c-warn", "Not restorable"],
  running: ["c-run", "Running"], queued: ["c-idle", "Queued"],
};
function mark(state, extra) {
  const [cls, word, tag, hollow] = STATES[state] || ["c-idle", state, ""];
  const t = extra ?? tag;
  return `<div class="st ${cls}"><i class="${hollow ? "hollow" : ""}"></i><b>${esc(word)}</b>${t ? `<span>${esc(t)}</span>` : ""}</div>`;
}
function verdictLine(v) {
  const [cls, word] = VERDICTS[v] || ["c-idle", v];
  return `<div class="v st ${cls}"><b>${esc(word)}</b></div>`;
}
// Uppercase policy events ("NETWORK: DENIED, ...") read as shouting; keep the words, drop the caps.
const calm = s => String(s || "").replace(/^([A-Z][A-Z /-]+):/, (_, p) => p.charAt(0) + p.slice(1).toLowerCase() + ":")
  .replace(/\b(DENIED|READ-ONLY|NOT DESTROYED|TIMEOUT|CAP HIT)\b/g, w => w.toLowerCase());

/* Check groups, as the spec names them: manifest, business logic, app boot. */
function group(name) {
  if (/business rules|books balance|invoice|receivable|stock|orphan|ledger|fk integrity/i.test(name)) return "Business logic";
  if (/^app |api health|login|smoke/i.test(name)) return "App boot";
  return "Manifest and restore";
}
function groups(checks) {
  const out = {"Manifest and restore": [], "Business logic": [], "App boot": []};
  for (const c of checks) out[group(c.name)].push(c);
  return Object.entries(out).filter(([, v]) => v.length);
}

/* ---------- Backups view: the RestoreGuard runtime (watched ERP backups) ---------- */
const rg = {summaries: [], versions: [], details: {}, live: {}, sel: null, es: null};

async function rgLoad() {
  const [list, health] = await Promise.all([getJSON("rg/api/backups"), getJSON("rg/health")]);
  rg.summaries = list;
  rg.versions = health.app_versions;
  if (!rg.sel && list.length) {
    const b = list.find(b => b.status !== "queued") || list[0];
    rg.sel = {b: b.id, v: rg.versions[rg.versions.length - 1]};
  }
  if (rg.sel) await rgDetail(rg.sel.b);
}
async function rgDetail(id, force) {
  const s = rg.summaries.find(b => b.id === id);
  if (!s || (!force && rg.details[id] && rg.details[id].status === s.status)) return;
  rg.details[id] = await getJSON(`rg/api/backups/${encodeURIComponent(id)}`);
}
function rgCell(id, v) {
  const s = rg.summaries.find(b => b.id === id);
  const live = rg.live[`${id}@${v}`];
  if (s.status === "running" && live && !s.cells[v]) return {state: live.state || "running", reason: live.step, elapsed_s: live.t};
  if (s.cells[v]) return s.cells[v];
  return {state: s.status === "queued" || s.status === "running" ? s.status : "not_run", reason: ""};
}
function rgView() {
  const ss = rg.summaries;
  const done = ss.filter(b => !["queued", "running"].includes(b.status));
  const ready = done.filter(b => b.status === "dr_ready"), q = done.filter(b => b.status === "quarantined");
  const newest = ready.slice().sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""))[0];
  return {
    meta: `RestoreGuard · Nordvik Handel ERP (stand-in app) · ${ss.length} backups watched · each restored into a throwaway test instance, never production`,
    headline: !ss.length ? "No backups yet. The watcher picks up each new dump and its manifest."
      : `${ready.length} of ${done.length} backups DR ready` + (newest ? `; newest ${clock(newest.created_at)}` : "") + "."
        + (q.length ? ` <em>${q.length} quarantined: do not restore.</em>` : ""),
    actions: rg.sel && rg.details[rg.sel.b]?.certificate ? `<a class="btn" href="#cert">Certificate</a>` : "",
    cols: rg.versions.map(v => ({id: v, label: `App ${v}`})),
    rows: ss.map(b => ({
      // The timestamp prefix is in the sub line already; the suffix is what tells the backups apart.
      id: b.id, name: b.file.replace(/^\d{8}T\d{6}Z[-_]/, ""), full: b.file, verdict: b.status,
      sub: [b.created_at && clock(b.created_at), b.schema_version != null && `schema v${b.schema_version}`, mb(b.bytes)].filter(Boolean).join(" · "),
      cells: Object.fromEntries(rg.versions.map(v => { const c = rgCell(b.id, v); return [v, {state: c.state,
        line: cellLine(c.state, c.reason, c.elapsed_s, b.status === "running")}]; })),
    })),
    sel: rg.sel,
  };
}
function cellLine(state, reason, s, running) {
  if (running && ["running", "queued"].includes(state)) return reason ? `${reason}` : "waiting for a sandbox";
  if (state === "healed") return `bridge migration · ${sec(s)}`;
  if (state === "native") return `${sec(s)}`;
  return [reason, sec(s)].filter(Boolean).join(" · ");
}
function rgPanel() {
  if (!rg.sel) return "";
  const d = rg.details[rg.sel.b], v = rg.sel.v;
  if (!d) return `<div class="panel"><p class="muted">Loading</p></div>`;
  const c = d.cells[v], live = rg.live[`${d.id}@${v}`];
  const head = `<div class="meta mono">${esc(d.file)}</div><h2>App ${esc(v)}</h2>`;
  if (!c) {
    const evs = live ? live.events : [];
    return `<div class="panel">${head}<div style="margin-top:8px">${mark(d.status === "queued" ? "queued" : "running")}</div>
      ${evs.length ? `<section><h3><span>Live</span><span>${sec(live.t)}</span></h3>${eventRows(evs)}</section>`
        : `<p class="lead">Each backup is proved on one app version at a time, in a fresh sandbox.</p>`}</div>`;
  }
  const checks = c.checks.map(k => ({name: k.check, pass: k.pass, detail: k.detail}));
  const m = d.manifest || {};
  return `<div class="panel">${head}
    <div style="margin-top:8px">${mark(c.state)}</div>
    <p class="lead">${esc(c.reason)}</p>
    ${targetLine(c.restored_into, (d.logs[v] || []).find(e => e.type === "sandbox")?.name,
      (d.logs[v] || []).some(e => e.type === "sandbox" && e.phase === "destroyed"))}
    ${containment(c.signals.map(s => ({signal: s})).concat(), c.static_scan, d.logs[v])}
    ${groups(checks).map(([g, ks]) => checkSection(g, ks)).join("")}
    ${bridgeSection(c.bridges.map(b => ({name: b.name, round: b.round, sha256: b.sha256, changes: b.changes,
        url: `rg/api/backups/${encodeURIComponent(d.id)}/bridges/${encodeURIComponent(b.name)}`})), c.llm_calls)}
    ${timings(Object.entries(c.timings), c.elapsed_s)}
    <section><h3><span>Backup manifest</span></h3><dl class="kv">
      <dt>sha256</dt><dd>${esc(m.sha256 || "")}</dd>
      <dt>taken</dt><dd>${esc(m.created_at || "")} by app ${esc(m.app_version || "")}</dd>
      ${Object.entries(m.row_counts || {}).filter(([k]) => k !== "schema_version").map(([k, n]) => `<dt>${esc(k)}</dt><dd>${n.toLocaleString("en")} rows</dd>`).join("")}
    </dl></section>
    <details><summary>Run log, ${(d.logs[v] || []).length} events</summary>${eventRows(d.logs[v] || [])}</details>
    <div class="links no-print">${d.certificate ? `<a href="#cert">DR certificate</a>` : ""}
      <button class="btn" id="rerun" ${["queued", "running"].includes(d.status) ? "disabled" : ""}>Run again</button></div>
  </div>`;
}
function rgStream() {
  if (rg.es) return;
  rg.es = new EventSource("rg/api/stream");
  rg.es.onopen = () => setLive(true);
  rg.es.onerror = () => setLive(false);
  rg.es.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === "backup") { rgRefresh(); return; }
    if (!ev.cell) return;
    const L = rg.live[ev.cell] ||= {events: [], state: "running"};
    L.events.push(ev); L.t = ev.t;
    if (ev.type === "check") L.step = ev.check;
    if (ev.type === "bridge") { L.state = "healing"; L.step = `bridge round ${ev.round}`; }
    if (ev.type === "verdict") { L.state = ev.state; L.step = ev.reason; rgRefresh(); }
    if (view === "backups") draw();
  };
}
let rgTimer;
function rgRefresh() {
  clearTimeout(rgTimer);
  rgTimer = setTimeout(async () => {
    rg.summaries = await getJSON("rg/api/backups");
    if (rg.sel) await rgDetail(rg.sel.b);
    if (view === "backups") draw();
  }, 300);
}

/* ---------- Drill view: preloaded dumps + upload, poisoned dump included (the spec's demo) ---------- */
const dr = {proof: null, runId: null, live: null, sel: null, upload: null, es: null};

async function drLoad() {
  const r = await getJSON("api/runs?fixture=matrix&limit=1");
  if (r.active.length) return drFollow(r.active[0]);
  if (r.runs.length) { dr.runId = r.runs[0].run_id; dr.proof = await getJSON(`api/runs/${dr.runId}/proof.json`); }
  if (dr.proof && !dr.sel) {
    const q = dr.proof.matrix.find(m => m.status.startsWith("QUARANTINED"));
    dr.sel = {b: (q || dr.proof.matrix[0]).backup, v: dr.proof.matrix[0].app_versions[q ? 0 : 1]?.app || dr.proof.matrix[0].app_versions[0].app};
  }
}
function drFollow(runId) {
  dr.runId = runId; dr.proof = null;
  dr.live = {apps: [], backups: [], cells: {}, events: [], rows: {}, steps: []};
  dr.es?.close();
  dr.es = new EventSource(`api/runs/${runId}/events`);
  dr.es.onopen = () => setLive(true);
  dr.es.onmessage = e => {
    const ev = JSON.parse(e.data), L = dr.live;
    L.events.push(ev);
    if (ev.type === "matrix" && ev.phase === "init") { L.apps = ev.apps; L.backups = ev.backups;
      if (!dr.sel) dr.sel = {b: ev.backups[ev.backups.length - 1].file, v: ev.apps[0].title}; }
    if (ev.type === "matrix" && ev.phase === "cell") L.cells[`${ev.backup}|${ev.app}`] = {...L.cells[`${ev.backup}|${ev.app}`], ...ev, t: ev.t};
    if (ev.type === "matrix" && ev.phase === "row") L.rows[ev.backup] = ev.level;
    if (ev.type === "step") L.steps.push(ev);
    if (ev.type === "verdict") L.verdict = ev;
    if (view === "drill") draw();
  };
  dr.es.addEventListener("end", async () => {
    dr.es.close(); dr.es = null; setLive(view === "backups" && !!rg.es);
    try { dr.proof = await getJSON(`api/runs/${runId}/proof.json`); dr.live = null; } catch (err) { note(`Drill ended without a certificate: ${err.message}`); }
    if (view === "drill") draw();
  });
}
const fileOf = id => dr.live?.backups.find(b => b.id === id)?.file || id;
const titleOf = id => dr.live?.apps.find(a => a.id === id)?.title || id;
function drReceipts(file, app) {
  return (dr.proof?.command_receipts || []).filter(r => String(r.n).startsWith(`${file} on ${app}`));
}
function drView() {
  const running = !!dr.live;
  const base = {cols: [], rows: [], sel: dr.sel, actions: drActions(running)};
  if (running) {
    const L = dr.live;
    base.cols = L.apps.map(a => ({id: a.title, label: a.title}));
    base.rows = L.backups.map(b => ({
      id: b.file, name: b.file, verdict: L.rows[b.id] ? ({ready: "ready", "not restorable": "failed"}[L.rows[b.id]] || L.rows[b.id]) : "running",
      sub: `schema v${b.version} · ${mb(b.size)} · ${b.sha256.slice(0, 12)}`,
      cells: Object.fromEntries(L.apps.map(a => { const c = L.cells[`${b.id}|${a.id}`] || {state: "running"};
        return [a.title, {state: c.state === "drift" && c.bridge ? "healing" : c.state, line: c.state === "healing"
          ? `bridge round ${c.round}` : (c.detail || "fresh sandbox: restore, boot, suite")}]; })),
    }));
    base.meta = `Drill · run ${dr.runId.slice(-6)} · running · ${sec(L.events.at(-1)?.t)}`;
    base.headline = L.verdict ? esc(L.verdict.headline) : `${L.backups.length} backups x ${L.apps.length} app versions, one sealed sandbox per cell.`;
    return base;
  }
  const p = dr.proof;
  if (!p) return {...base, meta: "Drill", headline: "No drill has run yet."};
  const apps = p.matrix[0].app_versions.map(a => a.app);
  base.cols = apps.map(a => ({id: a, label: a}));
  base.rows = p.matrix.map(m => ({
    id: m.backup, name: m.backup,
    verdict: m.status.startsWith("QUARANTINED") ? "quarantined" : m.status === "DR READY" ? "ready" : "failed",
    sub: `schema v${m.schema_version} · ${mb(m.bytes)} · ${m.sha256.slice(0, 12)}`,
    cells: Object.fromEntries(m.app_versions.map(a => {
      const rc = drReceipts(m.backup, a.app), s = rc.reduce((t, r) => t + (r.elapsed || 0), 0);
      const inc = p.incidents.find(i => i.backup === m.backup)?.detonations.find(d => d.app === a.app);
      const tests = a.suite.length + a.control_plane_checks.length;
      return [a.app, {state: a.result, line: a.result === "quarantined" && inc
        ? `${inc.signals.length} attacks contained · exit ${inc.exit}`
        : a.result === "healed" ? `${a.bridge} · ${tests} checks · ${sec(s)}`
        : a.result === "native" ? `${tests} checks pass · ${sec(s)}` : a.detail}];
    })),
  }));
  const ready = p.matrix.filter(m => m.status === "DR READY"), q = p.matrix.filter(m => m.status.startsWith("QUARANTINED"));
  base.meta = `Drill · test instances only · Nordvik Handel ERP · run ${p.run_id.slice(-6)} · ${clock(p.generated_at.replace(/(\d\d)(\d\d)$/, "$1:$2"))} · ${sec(p.elapsed_s)}`;
  base.headline = `${ready.length} of ${p.matrix.length} backups DR ready.` + (q.length ? ` <em>${q.map(m => esc(m.backup)).join(", ")} quarantined: do not restore.</em>` : "");
  return base;
}
function drActions(running) {
  return `<label class="btn" for="file" title="Your own SQL dump, up to 25 MB">${dr.upload ? esc(dr.upload.name) : "Add .sql"}</label>
    <input type="file" id="file" accept=".sql,.db,.dump,text/plain" hidden>
    ${dr.proof ? `<a class="btn" href="#cert">Certificate</a>` : ""}
    <button class="btn primary" id="run" ${running ? "disabled" : ""}>${running ? "Running" : "Run drill"}</button>`;
}
function drPanel() {
  if (!dr.sel) return "";
  const {b, v} = dr.sel;
  const head = `<div class="meta mono">${esc(b)}</div><h2>${esc(v)}</h2>`;
  if (dr.live) {
    const L = dr.live, bid = L.backups.find(x => x.file === b)?.id, aid = L.apps.find(x => x.title === v)?.id;
    const c = L.cells[`${bid}|${aid}`] || {state: "running"};
    const evs = L.events.filter(e => e.backup === bid && e.app === aid && e.type !== "cpu" && e.type !== "matrix" && !(e.type === "log" && e.stream === "stdout"));
    const pol = evs.filter(e => e.type === "policy");
    return `<div class="panel">${head}<div style="margin-top:8px">${mark(c.state === "drift" && c.bridge ? "healing" : c.state)}</div>
      ${targetLine(null, evs.find(e => e.type === "sandbox")?.name)}
      <p class="lead">${esc(c.detail || "")}</p>
      ${pol.length ? `<section><h3><span>Containment</span><span>${pol.length} signals</span></h3>${eventRows(pol, true)}</section>` : ""}
      ${c.host ? checkSection("Checks so far", c.host.map(k => ({name: k.check, pass: k.pass, detail: k.detail}))) : ""}
      ${c.changes ? `<section><h3><span>Bridge, round ${c.round}</span></h3><div class="code">${esc(c.changes)}</div></section>` : ""}
      <section><h3><span>Live</span><span>${sec(evs.at(-1)?.t)}</span></h3>${eventRows(evs.slice(-14))}</section></div>`;
  }
  const p = dr.proof, m = p.matrix.find(x => x.backup === b), a = m?.app_versions.find(x => x.app === v);
  if (!a) return "";
  const inc = p.incidents.find(i => i.backup === b), det = inc?.detonations.find(d => d.app === v);
  const rc = drReceipts(b, v);
  const checks = a.suite.map(t => ({name: t.test, pass: t.pass, detail: t.detail}))
    .concat(a.control_plane_checks.map(k => ({name: k.check, pass: k.pass, detail: k.detail})));
  const br = a.bridge && p.bridges[a.bridge];
  const sandbox = det ? det.sandbox : rc.at(-1)?.name;
  return `<div class="panel">${head}
    <div style="margin-top:8px">${mark(a.result)}</div>
    ${targetLine(null, sandbox, det ? det.destroyed : rc.at(-1)?.destroyed)}
    <p class="lead">${esc(det ? "The dump tried to attack the restore host. Each attempt hit a wall, then the sandbox was destroyed." : a.detail)}</p>
    ${det ? containmentDrill(det, inc) : ""}
    ${groups(checks).map(([g, ks]) => checkSection(g, ks)).join("")}
    ${br ? bridgeSection([{name: a.bridge, round: br.rounds, sha256: br.sha256, changes: br.changes,
        url: `api/runs/${p.run_id}/bridges/${encodeURIComponent(a.bridge)}`}],
        p.llm_calls.filter(l => l.purpose.includes(a.bridge.replace(/^bridge_|\.sql$/g, "").replace("_to_", " to ")))) : ""}
    ${rc.length ? timings(rc.map(r => [String(r.n).split(", ").slice(1).join(", ") || "sandbox", r.elapsed]), rc.reduce((t, r) => t + r.elapsed, 0)) : ""}
    <section><h3><span>Sandbox</span></h3><dl class="kv">
      ${sandbox ? `<dt>last sandbox</dt><dd>${esc(sandbox)}, ${det ? `exit ${det.exit}` : `exit ${rc.at(-1)?.exit}`}, ${(det ? det.destroyed : rc.at(-1)?.destroyed) ? "destroyed" : "NOT destroyed"}</dd>` : ""}
      <dt>policy</dt><dd>${esc(policyLine(p.sandbox_policy))}</dd>
      <dt>backup sha256</dt><dd>${esc(m.sha256)}</dd></dl></section>
    <div class="links no-print"><a href="#cert">DR certificate</a>${inc ? `<a href="api/runs/${p.run_id}/incident.json">Incident log (JSON)</a>` : ""}</div>
  </div>`;
}
function containmentDrill(det, inc) {
  return `<section><h3><span>Containment</span><span>${det.containment_events.length} signals</span></h3>
    ${eventRows(det.containment_events, true)}
    <div class="rows ev"><div><span class="t">${sec(det.elapsed_s).replace(" s", "")}</span><span>Sandbox ${esc(det.sandbox)} ${det.destroyed ? "destroyed" : "NOT destroyed"}, exit ${esc(det.exit)}</span></div></div></section>
    <section><h3><span>Static scan of the dump</span><span>${inc.static_scan.length} lines</span></h3>
    <div class="code">${inc.static_scan.map(f => `line ${f.line}  ${esc(f.text)}\n        ${esc(f.why)}`).join("\n")}</div></section>`;
}

/* ---------- shared panel parts ---------- */
function checkSection(title, ks) {
  const pass = ks.filter(k => k.pass).length;
  const rows = `<div class="rows">${ks.map(k => {
    const [n, when] = String(k.name).split(/ (?=\()/);
    return `<div><span class="m ${k.pass ? "ok" : "no"}">${k.pass ? "✓" : "✕"}</span><span class="n">${esc(n)}${when ? ` <small>${esc(when)}</small>` : ""}</span><span class="d">${esc(k.detail)}</span></div>`;
  }).join("")}</div>`;
  // All passing: one line, rows one click away. Any failure: open, so the failing check is the first thing read.
  if (pass === ks.length) return `<section><details class="grp"><summary><h3><span>${esc(title)}</span><span><b>✓</b> ${pass} of ${ks.length} pass</span></h3></summary>${rows}</details></section>`;
  return `<section><h3><span>${esc(title)}</span><span>${pass} of ${ks.length}</span></h3>${rows}</section>`;
}
function containment(sigs, scan, events) {
  const pol = (events || []).filter(e => e.type === "policy");
  if (!sigs.length && !(scan || []).length) return "";
  return `<section><h3><span>Containment</span><span>${sigs.length} signals</span></h3>${pol.length ? eventRows(pol, true)
    : `<div class="rows">${sigs.map(s => `<div><span class="m no">●</span><span>${esc(s.signal)}</span><span></span></div>`).join("")}</div>`}</section>
    ${(scan || []).length ? `<section><h3><span>Static scan of the dump</span><span>${scan.length}</span></h3><div class="code">${scan.map(f => typeof f === "string" ? esc(f) : `line ${esc(f.line)}  ${esc(f.text)}\n        ${esc(f.why)}`).join("\n")}</div></section>` : ""}`;
}
function bridgeSection(bs, llm) {
  if (!bs.length) return "";
  const l = (llm || [])[0];
  return bs.map(b => `<section><h3><span>Bridge migration, round ${esc(b.round)}</span><span>${l ? `${esc(l.model)} · ${sec(l.latency_s)}` : ""}</span></h3>
    <div class="code">${esc(b.changes)}</div>
    <div class="links"><a href="${b.url}" download="${esc(b.name)}">Download ${esc(b.name)}</a><span class="mono muted">sha256 ${esc(b.sha256.slice(0, 16))}</span></div></section>`).join("");
}
function timings(pairs, total) {
  if (!pairs.length) return "";
  const max = Math.max(...pairs.map(p => +p[1] || 0), 0.01);
  return `<section><h3><span>Timing</span><span>${sec(total)}</span></h3>${pairs.map(([n, s]) =>
    `<div class="timing"><span>${esc(n)}</span><span class="b"><i style="width:${(100 * (+s || 0) / max).toFixed(1)}%"></i></span><span class="s">${sec(s)}</span></div>`).join("")}</section>`;
}
function eventRows(evs, policy) {
  return `<div class="rows ev">${evs.map(e => {
    const text = e.type === "check" ? `${e.pass ? "✓" : "✕"} ${e.check}${e.detail ? `: ${e.detail}` : ""}`
      : e.type === "sandbox" ? `sandbox ${e.name} ${e.phase}${e.exit != null ? `, exit ${e.exit}` : ""}`
      : e.type === "llm" ? `${e.model} ${e.purpose} ${e.phase}${e.latency_s ? `, ${e.latency_s} s` : ""}`
      : e.type === "bridge" ? `bridge ${e.name}, round ${e.round}`
      : e.type === "verdict" ? `verdict: ${e.state}, ${e.reason}`
      : e.type === "log" ? `${e.stream}: ${e.line}`
      : e.event || e.detail || e.type;
    return `<div><span class="t">${e.t != null ? (+e.t).toFixed(2) : ""}</span><span${policy ? ' class="st c-bad" style="font-weight:400"' : ""}>${policy ? "<i></i>" : ""}<span>${esc(calm(text))}${policy && e.detail ? `<br><span class="muted mono">${esc(e.detail)}</span>` : ""}</span></span></div>`;
  }).join("")}</div>`;
}
// Every restore lands in a throwaway TEST instance of the app (own container, own DB, no network), never production.
// Uses the runtime's explicit target when it reports one, else the sandbox that held the test instance.
function targetLine(target, sandbox, destroyed) {
  const t = target ? [target.instance, target.database?.replace(/^.*?(Postgres[^,]*?) \S+(, .*)?$/, "$1$2")].filter(Boolean).join(" · ")
    : sandbox ? `test instance ${sandbox}` : "test instance (sandbox)";
  return `<dl class="kv target"><dt>restored into</dt><dd>${esc(t)}${destroyed === false ? ", NOT destroyed" : destroyed ? ", destroyed after the checks" : ""}${target?.production_touched === false ? " · production untouched" : ""}</dd></dl>`;
}
const policyLine = p => p ? [p.runtime, `network ${String(p.network).split(" ")[0]}`, `rootfs ${p.rootfs}`, `${p.memory} RAM`,
  `${p.cpus} CPU`, `pids ${p.pids_limit}`, `caps ${p.capabilities}`, `${p.timeout_s} s cap`].join(" · ") : "";

/* ---------- certificate (both engines carry the same matrix shape) ---------- */
function certView() {
  const c = view === "drill" ? dr.proof : rg.details[rg.sel?.b]?.certificate;
  if (!c) return `<p class="muted">No certificate for this selection yet.</p>`;
  const json = view === "drill" ? `api/runs/${c.run_id}/proof.json` : `rg/api/backups/${encodeURIComponent(rg.sel.b)}/certificate.json`;
  const verdicts = c.matrix.map(m => m.status);
  return `<div class="cert">
    <div class="head"><div><div class="meta">${esc(c.issuer || "BackupAirlock")} · ${esc(c.generated_at)}</div>
      <h2>DR Readiness Certificate</h2>
      <div class="stamp">${c.matrix.map(m => `${esc(m.backup)}: ${esc(m.status.split(":")[0].toLowerCase())}`).join(" · ")}</div></div>
      <div class="actions no-print"><a class="btn" href="#">Back</a><a class="btn" href="${json}">Export JSON</a>
        ${view === "drill" ? `<a class="btn" href="api/runs/${c.run_id}/proof.html">Export HTML</a>` : ""}<button class="btn primary" onclick="print()">Print</button></div></div>
    <section><h3 class="colhead">Backup x app version</h3><table><tr><th>Backup</th><th>App version</th><th>Result</th><th>Bridge</th><th>Checks</th></tr>
      ${c.matrix.map(m => m.app_versions.map((a, i) => { const ks = (a.suite || []).concat(a.control_plane_checks || []);
        return `<tr><td>${i ? "" : `<b class="mono">${esc(m.backup)}</b><br><span class="mono muted">${esc(m.sha256)}</span>`}</td><td>${esc(a.app)}</td>
          <td>${mark(a.result)}</td><td class="mono">${a.bridge ? `${esc(a.bridge)}<br><span class="muted">${esc(a.bridge_sha256.slice(0, 16))}</span>` : ""}</td>
          <td>${ks.length ? `${ks.filter(k => k.pass).length} of ${ks.length}` : "not run, sandbox killed"}</td></tr>`; }).join("")).join("")}</table></section>
    <section><h3 class="colhead">Sandbox policy</h3><dl class="kv">${Object.entries(c.sandbox_policy).map(([k, v]) => `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${esc(v)}</dd>`).join("")}</dl></section>
    <section><h3 class="colhead">Model calls</h3><dl class="kv"><dt>provider</dt><dd>${esc(c.inference)}</dd>
      ${(c.llm_calls || []).map(l => `<dt>${esc(l.purpose)}</dt><dd>${esc(l.model)} · ${sec(l.latency_s)} · ${l.tokens} tokens</dd>`).join("") || "<dt>calls</dt><dd>none needed</dd>"}</dl></section>
    <section><h3 class="colhead">Seal</h3><dl class="kv"><dt>proof sha256</dt><dd>${esc(c.proof_sha256)}</dd></dl>
      <p class="note">sha256 of the rest of this certificate (JSON, sorted keys). Recompute it to check nothing was edited.</p></section>
  </div>`;
}

/* ---------- render ---------- */
let view = "backups";
function setLive(on) { $("#live").className = "live" + (on ? " on" : ""); $("#live span").textContent = on ? "live" : view === "drill" ? "no drill running" : "offline"; }
function note(t) { $("#note").textContent = t || ""; }
function draw() {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  const V = view === "drill" ? drView() : rgView();
  $("#meta").textContent = V.meta || "";
  $("#headline").innerHTML = V.headline || "";
  $("#actions").innerHTML = V.actions || "";
  if (location.hash === "#cert") { $("#body").innerHTML = certView(); return bind(); }
  const sel = V.sel;
  $("#body").innerHTML = `<div class="main"><div>
    <div class="matrix"><div class="colhead corner">Backup</div>${V.cols.map(c => `<div class="colhead">${esc(c.label)}</div>`).join("")}
    ${V.rows.map(r => `<div class="row"><div class="bk"><div class="name" title="${esc(r.full || r.name)}">${esc(r.name)}</div><div class="sub">${esc(r.sub)}</div>${verdictLine(r.verdict)}</div>
      ${V.cols.map(c => { const x = r.cells[c.id] || {state: "not_run", line: ""};
        return `<button class="cell" data-b="${esc(r.id)}" data-v="${esc(c.id)}" aria-pressed="${!!sel && sel.b === r.id && sel.v === c.id}">
          <div class="app">${esc(c.label)}</div>${mark(x.state)}<div class="d" title="${esc(x.line)}">${esc(x.line)}</div></button>`; }).join("")}</div>`).join("")}
    </div>${V.rows.length ? "" : `<div class="empty">Nothing to show yet.</div>`}</div>
    <div>${view === "drill" ? drPanel() : rgPanel()}</div></div>`;
  bind();
}
function bind() {
  document.querySelectorAll(".cell").forEach(el => el.onclick = async () => {
    const s = {b: el.dataset.b, v: el.dataset.v};
    if (view === "drill") dr.sel = s; else { rg.sel = s; await rgDetail(s.b).catch(e => note(e.message)); }
    draw();
    if (matchMedia("(max-width:900px)").matches) document.querySelector(".panel")?.scrollIntoView({behavior: "smooth"});
  });
  $("#rerun")?.addEventListener("click", async () => {
    const r = await fetch(`rg/api/backups/${encodeURIComponent(rg.sel.b)}/rerun`, {method: "POST"});
    note(r.ok ? "Queued. The cells fill in as the sandbox reports." : `Not queued: ${(await r.json()).detail}`);
    rgRefresh();
  });
  $("#file")?.addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    note(`Uploading ${f.name}`);
    const r = await fetch(`api/uploads?name=${encodeURIComponent(f.name)}`, {method: "POST", body: f});
    if (!r.ok) { dr.upload = null; note(`Upload refused: ${(await r.json()).detail}`); }
    else { dr.upload = await r.json(); note(`${dr.upload.name} (${mb(dr.upload.bytes)}) joins the next drill as a fourth row.`); }
    draw();
  });
  $("#run")?.addEventListener("click", async () => {
    const r = await fetch(`api/runs/matrix${dr.upload ? "?upload=" + dr.upload.id : ""}`, {method: "POST"});
    if (!r.ok) { note(`Not started: ${(await r.json()).detail}`); return; }
    note(""); dr.sel = null; dr.upload = null; drFollow((await r.json()).run_id); draw();
  });
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  view = b.dataset.view; history.replaceState(null, "", "?view=" + view); note(""); start();
});
window.addEventListener("hashchange", draw);
async function start() {
  draw();
  try {
    if (view === "drill") await drLoad(); else { await rgLoad(); rgStream(); }
  } catch (e) { note(view === "drill" ? `Drill results unavailable: ${e.message}` : `RestoreGuard runtime unavailable: ${e.message}`); }
  setLive(view === "drill" ? !!dr.es : !!rg.es);
  draw();
}
view = new URLSearchParams(location.search).get("view") === "drill" ? "drill" : "backups";
start();
</script>
</body>
</html>
