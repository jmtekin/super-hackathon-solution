<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BackupAirlock</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%276%27 fill=%27%233fb950%27/%3E%3C/svg%3E">
<style>
/* Console v7 (one view: timeline at the bottom, checks above; docs/design/first-impression/README.md) on the v5 system. Colour: design/COLOR.md (Radix slate 12-step neutrals, state hues only on marks, links and the one danger word).
   Spacing: design/SPACING.md (4 8 12 16 24 32 48; inside a group < between groups < between regions).
   Type 12 / 13 / 14 / 16 / 20. */
:root{
  --bg:#111113;--surface:#18191b;--hover:#272a2d;--selected:#2e3135;
  --line:#363a3f;--line-2:#43484e;--strong:#5a6169;--ink:#edeef0;--ink-2:#c4c8ce;
  --ok:#3fb950;--heal:#6cb6a8;--warn:#d29922;--bad:#ff9592;--accent:#70b8ff;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--ink-2)}
.page{max-width:1440px;margin:0 auto;padding:var(--s5) var(--s7) var(--s7)}

/* header */
.bar{display:flex;align-items:center;gap:var(--s5);height:40px}
.brand{font-weight:600;font-size:14px}
.tabs{display:flex;gap:var(--s1)}
.tabs button{height:32px;padding:0 var(--s3);border-radius:3px;color:var(--ink-2);font-size:13px}
.tabs button:hover{background:var(--hover)}
.tabs button[aria-selected=true]{color:var(--ink);background:var(--selected)}
.live{margin-left:auto;display:flex;align-items:center;gap:var(--s2);color:var(--ink-2);font-size:12px}
.live i{width:6px;height:6px;border-radius:1px;background:var(--strong)}
.live.on i{background:var(--ok)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s5);margin-top:var(--s6)}
.meta{font-size:12px;color:var(--ink-2)}
h1{font-size:20px;line-height:28px;font-weight:600;margin-top:var(--s1)}
h1 em{font-style:normal;color:var(--bad)}
.actions{display:flex;gap:var(--s4);align-items:center;flex-shrink:0;font-size:13px}
.btn{height:32px;padding:0 var(--s3);border-radius:3px;font-size:13px;font-weight:600;line-height:30px;border:1px solid var(--line-2);color:var(--ink);white-space:nowrap;display:inline-block}
.btn.primary{background:var(--selected);border-color:var(--strong)}
.btn:disabled{opacity:.45;cursor:default}
.btn:hover{text-decoration:none;border-color:var(--strong);background:var(--hover)}
.note{font-size:12px;color:var(--ink-2);margin-top:var(--s2)}
.note:empty{display:none}

/* main grid: matrix 7 columns, panel 5; both start on the content-top line */
.main{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s7);margin-top:var(--s7);align-items:start}
.colhead{font:12px/16px var(--mono);color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;padding:0 var(--s4) var(--s2)}
.colhead.corner{padding-left:0}
.matrix{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr)}
.matrix > .row{display:contents}
/* one row rhythm: same hairline, same top padding, same 13/20 first line, so name and status share a baseline */
.bk,.cell{padding:var(--s3) var(--s4);border-top:1px solid var(--line);min-width:0}
.bk{padding-left:0}
.bk .name{font-size:13px;line-height:20px;font-weight:600;overflow-wrap:anywhere}
.bk .sub{font-size:12px;line-height:16px;color:var(--ink-2);margin-top:var(--s1)}
.cell{text-align:left;width:100%;display:flex;flex-direction:column;justify-content:flex-start}
.cell:hover{background:var(--hover)}
.cell[aria-pressed=true]{background:var(--selected);box-shadow:inset 2px 0 0 var(--strong)}
.st{display:flex;align-items:center;gap:var(--s2);font-size:13px;font-weight:600;line-height:20px}
.st i{width:8px;height:8px;border-radius:1px;flex-shrink:0;background:var(--c)}
.st i.hollow{background:none;box-shadow:inset 0 0 0 1.5px var(--c)}
.st b{font-weight:600}
.st.c-bad b{color:var(--bad)}
.st span{font-weight:400;color:var(--ink-2)}
.cell .d{font-size:12px;line-height:16px;color:var(--ink-2);margin-top:var(--s1)}
.cell .app{display:none;font:12px/16px var(--mono);color:var(--ink-2);margin-bottom:var(--s1)}
.c-ok{--c:var(--ok)}.c-heal{--c:var(--heal)}.c-warn{--c:var(--warn)}.c-bad{--c:var(--bad)}.c-idle{--c:var(--strong)}.c-run{--c:var(--ink)}

/* panel: no card; its text starts on the panel column's edge */
.panel{min-width:0}
.panel h2{font-size:16px;line-height:24px;font-weight:600;overflow-wrap:anywhere}
.panel h2 .muted{font-weight:400}
.panel .st{margin-top:var(--s2)}
.panel .lead{margin-top:var(--s1);color:var(--ink-2);font-size:13px}
.panel .lead:empty{display:none}
.panel section{margin-top:var(--s6)}
.panel h3 span + span{text-transform:none}
.panel h3{font:12px/16px var(--mono);color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;padding-bottom:var(--s2);display:flex;justify-content:space-between;gap:var(--s3)}
.rows > div{display:grid;grid-template-columns:16px minmax(0,1fr) minmax(0,1fr);column-gap:var(--s2);padding:var(--s2) 0;border-top:1px solid var(--line);font-size:13px;line-height:20px}
.rows .m{font-weight:700}
.rows .ok{color:var(--ok)}.rows .no{color:var(--bad)}.rows .warn{color:var(--warn)}
.rows .d{color:var(--ink-2);overflow-wrap:anywhere}
.rows .n small{color:var(--ink-2);font-size:12px}
.rows.ev > div{grid-template-columns:48px minmax(0,1fr)}
.rows.ev .t{font:12px/20px var(--mono);color:var(--ink-2)}
.rows.ev .st{align-items:flex-start;font-weight:400;margin-top:0}
.rows.ev .st i{margin-top:6px}
.rows.ev .st .muted{display:block}
.rows.ev span{overflow-wrap:anywhere;min-width:0}
.code{margin-top:var(--s2);background:var(--surface);border-radius:3px;padding:var(--s3);font:12px/20px var(--mono);color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto}
.kv{display:grid;grid-template-columns:auto 1fr;column-gap:var(--s4);row-gap:var(--s1);font-size:12px}
.kv dt{color:var(--ink-2)}
.kv dd{overflow-wrap:anywhere}
.kv.target{margin-top:var(--s4)}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s4);margin-top:var(--s6);font-size:13px}
section .links{margin-top:var(--s3)}
.timing{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 56px;column-gap:var(--s3);align-items:center;font-size:12px;padding:var(--s1) 0}
.timing .s{text-align:right}
.timing .b i{display:block;height:4px;border-radius:1px;background:var(--strong)}
details summary{cursor:pointer;color:var(--accent);font-size:13px;margin-top:var(--s6)}
details.grp summary{list-style:none;margin:0}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary h3 b{color:var(--ok);font-weight:400}

/* the one view (Jonas 15:35-15:36): checks of the selected backup above, the timeline of backups along the bottom, nothing else */
.page.full{max-width:none;padding:0}
.ov{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.brand{display:flex;align-items:baseline;gap:var(--s3);padding:var(--s4) var(--s7);border-bottom:1px solid var(--line)}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--ink-2)}
/* Run (Jonas 16:17): one primary action, three one-click stories beside it, the parameters in a small panel under it */
.brand{position:relative}
.ctl{margin-left:auto;align-self:center;display:flex;align-items:center;gap:var(--s3)}
.scen{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:4px}
.scen button{height:28px;padding:0 var(--s3);border-radius:3px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.scen button:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.scen button[aria-pressed=true]{background:var(--selected);color:var(--ink)}
.scen button:disabled:not([aria-pressed=true]),.ctl .quiet:disabled{opacity:.45;cursor:default}
.ctl .quiet{height:32px;padding:0 var(--s2);font-size:13px;color:var(--ink-2)}
.ctl .quiet:hover:not(:disabled){color:var(--ink)}
.brand .msg{font-size:12px;color:var(--ink-2);max-width:360px;text-align:right}
.brand .msg.err{color:var(--warn)}
.runp{position:absolute;right:var(--s7);top:calc(100% + var(--s2));z-index:5;width:400px;max-height:calc(100dvh - 96px);overflow:auto;display:grid;gap:var(--s4);
  padding:var(--s4);background:var(--surface);border:1px solid var(--line-2);border-radius:4px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.runp h3{font-size:12px;line-height:16px;font-weight:600;color:var(--ink-2);margin-bottom:var(--s1)}
.runp label{display:flex;align-items:center;gap:var(--s2);font-size:13px;line-height:28px;cursor:pointer}
.runp label i{width:8px;height:8px;border-radius:50%;background:var(--c);flex-shrink:0}
.runp label small{margin-left:auto;padding-left:var(--s3);font-size:12px;color:var(--strong);white-space:nowrap}
.runp .bks{max-height:196px;overflow:auto;margin-right:calc(-1 * var(--s2));padding-right:var(--s2)}
.runp .opts{display:grid;grid-template-columns:1fr 1fr;column-gap:var(--s4)}
.runp input{accent-color:var(--accent);margin:0}
.runp footer{display:flex;align-items:center;justify-content:flex-end;gap:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line)}
.sum{grid-column:1/-1;display:flex;flex-wrap:wrap;column-gap:var(--s5);row-gap:var(--s1);margin-top:calc(var(--s3) - var(--s5));font-size:13px;color:var(--ink-2)}
.sum strong{color:var(--ink);font-weight:600}
.dt{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-rows:auto auto minmax(0,1fr);column-gap:var(--s6);row-gap:var(--s5);padding:var(--s6) var(--s7) var(--s5);min-height:0}
.dt header{grid-column:1/-1;display:flex;align-items:baseline;flex-wrap:wrap;column-gap:var(--s4);row-gap:var(--s1)}
.dt h2{font-size:20px;line-height:28px;font-weight:600;overflow-wrap:anywhere}
.dt .when{font-size:13px;color:var(--ink-2)}
.ck{display:grid;align-content:start;gap:var(--s5);overflow:auto;min-height:0;padding-right:var(--s2)}
.ck h3{font-size:13px;line-height:20px;font-weight:600;padding-bottom:var(--s2);border-bottom:1px solid var(--line)}
.ck ul{list-style:none;margin-top:var(--s2)}
.ck li{display:grid;grid-template-columns:8px minmax(0,1fr) auto;column-gap:var(--s3);align-items:start;font-size:13px;line-height:24px}
.ck li i{margin-top:8px;width:8px;height:8px;border-radius:50%;background:var(--c)}
.ck li.skipped i,.ck li.waiting i{background:none;box-shadow:inset 0 0 0 1.5px var(--c)}
.ck li.skipped span,.ck li.waiting span{color:var(--ink-2)}
.term{overflow:auto;min-height:0;background:var(--surface);border-radius:3px;padding:var(--s3) var(--s4);font:12px/20px var(--mono);color:var(--ink-2)}
.term>div{display:grid;grid-template-columns:48px minmax(0,1fr);column-gap:var(--s3)}
.term>div>span:last-child{overflow-wrap:anywhere;white-space:pre-wrap}
.term .t{text-align:right;color:var(--strong)}
.term .hot{background:var(--hover);box-shadow:0 0 0 4px var(--hover);color:var(--ink)}
.term .c-bad{color:var(--bad)}
.term pre{margin:0 0 var(--s1) 60px;font:inherit;color:var(--strong);white-space:pre-wrap;overflow-wrap:anywhere}
.ck li b{font-size:12px;font-weight:400;color:var(--ink-2)}
.ck li b span{color:var(--strong);margin-right:var(--s3)}
.ck li.hot{background:var(--hover);box-shadow:0 0 0 4px var(--hover)}
.strip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:var(--s3);row-gap:var(--s1);align-items:center;font-size:12px;line-height:16px;color:var(--ink-2)}
.lane{position:relative;height:16px}
.lane::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--line)}
.lane em{position:absolute;top:5px;height:6px;min-width:2px;border-radius:1px;background:var(--line-2)}
.lane i{position:absolute;top:4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--bg)}
.lane i.hot{transform:scale(1.6);z-index:1}
.lane-s{text-align:right}
.axis{display:flex;justify-content:space-between;color:var(--strong)}
.ck li.done b{color:var(--ok)}
.ck li.fail b,.ck li.blocked b{color:var(--bad);font-weight:600}
.ck li.blocked i{width:6px;height:6px;margin:9px 1px 0;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--c)}
/* one mark per backup, oldest left, evenly spaced; colour = does it restore; a tick over the latest that does */
.band{--bg:var(--surface);background:var(--bg)}
.tl{position:relative;height:168px;margin:0 var(--s7);touch-action:none}
.tl::before{content:"";position:absolute;left:0;right:0;top:55px;height:2px;background:var(--line)}
.mk{position:absolute;top:56px;width:44px;height:44px;margin:-22px 0 0 -22px;display:grid;place-items:center}
.mk i{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px var(--bg);transition:transform .12s ease-out}
.mk i.hollow{background:var(--bg);box-shadow:inset 0 0 0 2px var(--c),0 0 0 4px var(--bg)}
.mk[aria-pressed=true] i{transform:scale(1.5);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--ink-2)}
.mk.c-bad i{width:12px;height:12px;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.mk.c-bad[aria-pressed=true] i{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c),0 0 0 7px var(--bg),0 0 0 8px var(--ink-2)}
.mk[aria-pressed=true] i.hollow{box-shadow:inset 0 0 0 1.5px var(--c),0 0 0 3px var(--bg),0 0 0 4px var(--ink-2)}
.mk.latest::before{content:"";position:absolute;left:21px;top:-8px;width:2px;height:12px;background:var(--ok)}
.lb{position:absolute;top:84px;transform:translateX(-50%);white-space:nowrap;font-size:12px;line-height:16px;color:var(--ink-2);text-align:center;pointer-events:none}
.lb span{display:block;color:var(--strong)}
.lb:first-of-type{transform:translateX(-22px);text-align:left}
.lb:last-of-type{transform:translateX(calc(22px - 100%));text-align:right}
.lb b{display:none;font-weight:600;color:var(--c)}
.lb.sel{color:var(--ink)}
.lb.sel span{color:var(--ink-2)}
.lb.sel b{display:block}
#ray{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .18s ease-out}
#ray.on{opacity:1}
#ray line{stroke:var(--ink-2);stroke-width:1;stroke-opacity:.45}
@media (prefers-reduced-motion:no-preference){
  #ray{transition:none}
  .mk i.run{animation:beat 1.2s ease-in-out infinite}
}
@keyframes beat{50%{transform:scale(1.3)}}

/* certificate */
.cert{max-width:880px;margin-top:var(--s7)}
.cert .head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s5)}
.cert h2{font-size:20px;line-height:28px;font-weight:600}
.cert table{width:100%;border-collapse:collapse;margin-top:var(--s2);font-size:13px}
.cert th{font:12px/16px var(--mono);color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:var(--s2) var(--s3) var(--s2) 0;border-bottom:1px solid var(--line-2)}
.cert td{padding:var(--s2) var(--s3) var(--s2) 0;border-bottom:1px solid var(--line);vertical-align:top}
.cert section{margin-top:var(--s6)}
.cert .kv{margin-top:var(--s2)}
.cert .colhead{padding-left:0}
.cert .stamp{font-size:13px;margin-top:var(--s1)}

@media (max-width:900px){
  .page{padding:var(--s4)}
  .bar{gap:var(--s3)}
  .live span{display:none}
  .top{display:block}
  .actions{margin-top:var(--s4);flex-wrap:wrap}
  h1{font-size:18px;line-height:26px}
  .main{display:block;margin-top:var(--s6)}
  /* cells bleed 12 px into the page margin so all text stays on the 16 px page edge */
  .matrix{grid-template-columns:1fr 1fr;margin:0 calc(-1 * var(--s3))}
  .matrix > .colhead{display:none}
  .cell .app{display:block}
  .bk{grid-column:1 / 3;padding:var(--s3) var(--s3) 0}
  .cell{border-top:0;padding:var(--s2) var(--s3) var(--s3)}
  .panel{margin-top:var(--s7)}
  .rows > div{grid-template-columns:16px minmax(0,1fr)}
  .rows .d{grid-column:2}
  .cert .head{display:block}
  .cert .head .actions{margin-top:var(--s3)}
  .cert table,.cert tbody,.cert tr,.cert td{display:block}
  .cert tr:first-child{display:none}
  .cert tr{padding:var(--s2) 0;border-bottom:1px solid var(--line)}
  .cert td{border:0;padding:2px 0;overflow-wrap:anywhere}
  .cert td:empty{display:none}
  .timing{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 48px}
  .dt{display:block;overflow:auto;padding:var(--s5) var(--s4) var(--s4)}
  .ck{overflow:visible;margin-top:var(--s5);padding-right:0}
  .term{margin-top:var(--s5);max-height:50vh}
  .tl{margin:0 var(--s5)}
  .brand{padding:var(--s3) var(--s4)}
  .brand span{display:none}
  .brand{flex-wrap:wrap;row-gap:var(--s3)}
  .ctl{display:contents}
  .ctl .quiet{order:1;margin-left:auto}
  .ctl .btn{order:1}
  .scen{order:2;width:100%}
  .scen button{flex:1;padding:0 var(--s1);font-size:12px}
  .brand .msg{order:3;width:100%;max-width:none;text-align:left}
  .brand .msg:empty{display:none}
  .runp{left:var(--s4);right:var(--s4);width:auto;top:calc(100% + var(--s1))}
  .sum{margin-top:var(--s2)}
}
@media print{
  :root{--bg:#fff;--surface:#f4f4f2;--hover:#fff;--selected:#fff;--line:#ddd;--line-2:#bbb;--strong:#999;--ink:#111;--ink-2:#444;--ok:#1d6b3e;--warn:#7a5200;--bad:#a3201a;--accent:#111}
  .bar,.top,.no-print{display:none}
  .page{padding:0}
}
</style>
</head>
<body>
<div class="page">
  <div class="bar">
    <span class="brand">BackupAirlock</span>
    <div class="tabs" role="tablist">
      <button role="tab" data-view="overview">Overview</button>
      <button role="tab" data-view="backups">Backups</button>
      <button role="tab" data-view="drill">Drill</button>
    </div>
    <div class="live" id="live"><i></i><span>offline</span></div>
  </div>
  <div class="top" id="top">
    <div style="min-width:0">
      <div class="meta" id="meta"></div>
      <h1 id="headline">Loading</h1>
    </div>
    <div class="actions" id="actions"></div>
  </div>
  <div class="note" id="note"></div>
  <div id="body"></div>
</div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
// Units join their number with a no-break space so "23.6 s" never wraps to a line of its own.
const mb = n => n == null ? "" : (n / 1048576).toFixed(n < 10485760 ? 2 : 1) + "\u00a0MB";
const sec = s => s == null ? "" : `${(+s).toFixed(1)}\u00a0s`;
const clock = d => new Date(d).toLocaleString("en-GB", {timeZone: "Europe/Stockholm", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
// A refused write explains itself: the console's JSON detail, or the VM's sign-in wall (Caddy answers 401 with no body).
const why = async r => r.status === 401 ? "sign in with the team password first" : (await r.json().catch(() => ({}))).detail || `${r.status} ${r.statusText}`;

const STATES = {

  healed:      ["c-heal", "Healed", ""],
  drift:       ["c-warn", "Drift", ""],
  healing:     ["c-warn", "Drift", "healing"],
  failed:      ["c-warn", "Not restorable", ""],
  quarantined: ["c-bad",  "Blocked", ""],
  running:     ["c-run",  "Running", "", true],
  queued:      ["c-idle", "Queued", "", true],
  not_run:     ["c-idle", "Not run", "", true],

// Uppercase policy events ("NETWORK: DENIED, ...") read as shouting; keep the words, drop the caps.
const calm = s => String(s || "").replace(/^([A-Z][A-Z /-]+):/, (_, p) => p.charAt(0) + p.slice(1).toLowerCase() + ":")
  .replace(/\b(DENIED|READ-ONLY|NOT DESTROYED|TIMEOUT|CAP HIT)\b/g, w => w.toLowerCase());

  for (const c of checks) out[group(c.name)].push(c);

}

/* ---------- Backups view: the backup watcher runtime (watched ERP backups) ---------- */

  if (s.cells[v]) return s.cells[v];

  if (["failed", "not_restorable"].includes(s.status)) return {state: "failed", reason: s.reason};

const shortName = f => f.replace(/^\d{8}[T_]\d{6}Z?[-_]/, "");
function rgView() {
  const ss = rg.summaries;

  const ready = done.filter(b => b.status === "dr_ready"), q = done.filter(b => b.status === "quarantined");
  const newest = ready.slice().sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""))[0];

    meta: `Watched backups · Nordvik Handel ERP (stand-in app) · ${ss.length} backups watched · each restored into a throwaway test instance, never production`,
    headline: !ss.length ? "No backups yet. The watcher picks up each new dump and its manifest."
      : `${ready.length} of ${done.length} backups DR ready` + (newest ? `; newest ${clock(newest.created_at)}` : "") + "."
        + (q.length ? ` <em>${q.length} blocked: do not restore.</em>` : ""),

    cols: rg.versions.map(v => ({id: v, label: `App ${v}`})),

      id: b.id, name: shortName(b.file), full: b.file,
      sub: [b.created_at && clock(b.created_at), b.schema_version != null && `schema ${/^\d/.test(b.schema_version) ? "v" : ""}${b.schema_version}`, mb(b.bytes)].filter(Boolean).join(" · "),
      cols: b.kind === "frappe" && rg.frappe ? [{id: rg.frappe, label: rg.frappe}] : null,

  if (state === "healed") return `bridge migration · ${sec(s)}`;
  if (state === "native") return `${sec(s)}`;
  if (state === "quarantined") return `${String(reason).replace(/^containment: ([^;]*).*$/, "$1").split(", ").length} attacks contained`;

// The cell names the failure in a few words; the panel carries the tool's full message.

/* ---------- Drill view: preloaded dumps + upload, poisoned dump included (the spec's demo) ---------- */
const dr = {proof: null, runId: null, live: null, sel: null, upload: null, es: null};

async function drLoad() {
  const r = await getJSON("api/runs?fixture=matrix&limit=1");
  if (r.active.length) return drFollow(r.active[0]);
  if (r.runs.length) { dr.runId = r.runs[0].run_id; dr.proof = await getJSON(`api/runs/${dr.runId}/proof.json`); }
  if (dr.proof && !dr.sel) {
    const q = dr.proof.matrix.find(m => m.status.startsWith("QUARANTINED"));
    dr.sel = {b: (q || dr.proof.matrix[0]).backup, v: dr.proof.matrix[0].app_versions[q ? 0 : 1]?.app || dr.proof.matrix[0].app_versions[0].app};

function drFollow(runId) {

/* ---------- shared panel parts ---------- */
// A ready or quarantined cell's reason restates its status or the sections below; only what adds something stays.

  const extra = String(reason || "").match(/\(([^)]*itself)\)/)?.[1];
  return extra ? `<p class="lead">${esc(extra.charAt(0).toUpperCase() + extra.slice(1))}.</p>` : "";
}
function checkSection(title, ks) {
  const pass = ks.filter(k => k.pass).length;
  const rows = `<div class="rows">${ks.map(k => {
    const [n, when] = String(k.name).split(/ (?=\()/);
    return `<div><span class="m ${k.pass ? "ok" : "no"}">${k.pass ? "✓" : "✕"}</span><span class="n">${esc(n)}${when ? ` <small>${esc(when)}</small>` : ""}</span><span class="d">${esc(k.detail)}</span></div>`;
  }).join("")}</div>`;
  // All passing: one line, rows one click away. Any failure: open, so the failing check is the first thing read.
  if (pass === ks.length) return `<section><details class="grp"><summary><h3><span>${esc(title)}</span><span><b>✓</b> ${pass} of ${ks.length} pass</span></h3></summary>${rows}</details></section>`;
  return `<section><h3><span>${esc(title)}</span><span>${pass} of ${ks.length}</span></h3>${rows}</section>`;
}
function containment(sigs, scan, events) {

    : `<div class="rows">${sigs.map(s => `<div><span class="m no">●</span><span>${esc(s.signal)}</span><span></span></div>`).join("")}</div>`}</section>
    ${(scan || []).length ? `<section><h3><span>Static scan of the dump</span><span>${scan.length} ${scan.length === 1 ? "line" : "lines"}</span></h3><div class="code">${scan.map(f => typeof f === "string" ? esc(f) : `line ${esc(f.line)}  ${esc(f.text)}\n        ${esc(f.why)}`).join("\n")}</div></section>` : ""}`;
}

    <div class="code">${esc(b.changes)}</div>

}

}
addEventListener("resize", ovLabels);
// A running log follows its newest line.
const ovTail = () => { const t = $("#term"); if (t?.dataset.live != null) t.scrollTop = t.scrollHeight; };
// A thin line from the cursor to the nearest mark (Jonas 15:35 "easy to not hover correctly over the dot"), only once the
// cursor is near the timeline (15:55 "only select if quite close", 16:08 radius halved); elsewhere the selection stays.
function ovFrame() {
  ovPtr.frame = 0;
  const ray = $("#ray");
  if (!ray) return;
  let near, d = Infinity;
  const tl = $(".tl")?.getBoundingClientRect(), close = tl && ovPtr.y > tl.top - 32 && ovPtr.y < tl.bottom && ovPtr.x > tl.left - 16 && ovPtr.x < tl.right + 16;
  if (ovPtr.on && close) for (const m of document.querySelectorAll(".mk")) {
    const r = m.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, e = (x - ovPtr.x) ** 2 + (y - ovPtr.y) ** 2;
    if (e < d) { d = e; near = {m, x, y}; }
  }
  ray.classList.toggle("on", !!near);
  if (!near) return;
  // The line stops at the selection ring, never over the mark.
  const l = ray.firstElementChild, dx = ovPtr.x - near.x, dy = ovPtr.y - near.y, k = Math.max(0, 1 - 18 / (Math.hypot(dx, dy) || 1));
  ray.classList.toggle("on", k > 0);
  l.setAttribute("x1", ovPtr.x); l.setAttribute("y1", ovPtr.y); l.setAttribute("x2", ovPtr.x - dx * k); l.setAttribute("y2", ovPtr.y - dy * k);
  ovPick(near.m.dataset.id);
}
const ovDraw = () => { ovPtr.frame ||= requestAnimationFrame(ovFrame); };
// Touch and pen: on the timeline only, so the checks above still scroll.
const ovPoint = e => {
  if (view !== "overview" || (e.pointerType !== "mouse" && !e.target.closest?.(".tl"))) return;
  ovPtr.x = e.clientX; ovPtr.y = e.clientY; ovPtr.on = true; ovDraw();
};
addEventListener("pointermove", ovPoint);
addEventListener("pointerdown", ovPoint);
addEventListener("pointerup", e => { if (e.pointerType !== "mouse") { ovPtr.on = false; ovDraw(); } });
document.addEventListener("pointerout", e => { if (!e.relatedTarget) { ovPtr.on = false; ovDraw(); } });
addEventListener("keydown", e => {
  if (view !== "overview" || !["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  const ms = [...document.querySelectorAll(".mk")], i = ms.findIndex(m => m.dataset.id === ovSel.id);
  const m = ms[Math.max(0, Math.min(ms.length - 1, i + (e.key === "ArrowLeft" ? -1 : 1)))];
  if (!m) return;
  e.preventDefault(); ovPtr.on = false; ovDraw(); ovPick(m.dataset.id); m.focus({preventScroll: true});
});

/* ---------- certificate (both engines carry the same matrix shape) ---------- */
function certView() {
  const c = view === "drill" ? dr.proof : rg.details[rg.sel?.b]?.certificate;
  if (!c) return `<p class="muted">No certificate for this selection yet.</p>`;
  const json = view === "drill" ? `api/runs/${c.run_id}/proof.json` : `rg/api/backups/${encodeURIComponent(rg.sel.b)}/certificate.json`;
  const verdicts = c.matrix.map(m => m.status);
  return `<div class="cert">
    <div class="head"><div><div class="meta">${esc(c.issuer || "BackupAirlock")} · ${esc(c.generated_at)}</div>
      <h2>DR Readiness Certificate</h2>
      <div class="stamp">${c.matrix.map(m => `${esc(m.backup)}: ${esc(m.status.split(":")[0].toLowerCase())}`).join(" · ")}</div></div>
      <div class="actions no-print"><a href="#">Back</a><a href="${json}">JSON</a>
        ${view === "drill" ? `<a href="api/runs/${c.run_id}/proof.html">HTML</a>` : ""}<button class="btn primary" onclick="print()">Print</button></div></div>
    <section><h3 class="colhead">Backup x app version</h3><table><tr><th>Backup</th><th>App version</th><th>Result</th><th>Bridge</th><th>Checks</th></tr>
      ${c.matrix.map(m => m.app_versions.map((a, i) => { const ks = (a.suite || []).concat(a.control_plane_checks || []);
        return `<tr><td>${i ? "" : `<b class="mono">${esc(m.backup)}</b><br><span class="mono muted">${esc(m.sha256)}</span>`}</td><td>${esc(a.app)}</td>
          <td>${mark(a.result)}</td><td class="mono">${a.bridge ? `${esc(a.bridge)}<br><span class="muted">${esc(a.bridge_sha256.slice(0, 16))}</span>` : ""}</td>
          <td>${ks.length ? `${ks.filter(k => k.pass).length} of ${ks.length}` : "not run, sandbox killed"}</td></tr>`; }).join("")).join("")}</table></section>
    <section><h3 class="colhead">Sandbox policy</h3><dl class="kv">${Object.entries(c.sandbox_policy).map(([k, v]) => `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${esc(v)}</dd>`).join("")}</dl></section>
    <section><h3 class="colhead">Model calls</h3><dl class="kv"><dt>provider</dt><dd>${esc(c.inference)}</dd>
      ${(c.llm_calls || []).map(l => `<dt>${esc(l.purpose)}</dt><dd>${esc(l.model)} · ${sec(l.latency_s)} · ${l.tokens} tokens</dd>`).join("") || "<dt>calls</dt><dd>none needed</dd>"}</dl></section>
    <section><h3 class="colhead">Seal</h3><dl class="kv"><dt>proof sha256</dt><dd>${esc(c.proof_sha256)}</dd></dl>
      <p class="note">sha256 of the rest of this certificate (JSON, sorted keys). Recompute it to check nothing was edited.</p></section>
  </div>`;
}

/* ---------- render ---------- */
let view = "overview";
function setLive(on) { $("#live").className = "live" + (on ? " on" : ""); $("#live span").textContent = on ? "live" : view === "drill" ? "no drill running" : "offline"; }
function note(t) { $("#note").textContent = t || ""; }
function draw() {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  const one = view === "overview" && location.hash !== "#cert";
  $(".page").classList.toggle("full", one);
  $(".bar").hidden = $("#top").hidden = one;
  if (one) { $("#body").innerHTML = ovView(); ovLabels(); ovTail(); if (ovPtr.on) ovDraw(); return bind(); }
  const V = view === "drill" ? drView() : rgView();
  $("#meta").textContent = V.meta || "";
  $("#headline").innerHTML = V.headline || "";
  $("#actions").innerHTML = V.actions || "";
  if (location.hash === "#cert") { $("#body").innerHTML = certView(); return bind(); }
  const sel = V.sel;
  // Nothing to list: the headline already says so.
  if (!V.rows.length) { $("#body").innerHTML = ""; return bind(); }
  $("#body").innerHTML = `<div class="main"><div>
    <div class="matrix"><div class="colhead corner">Backup</div>${V.cols.map(c => `<div class="colhead">${esc(c.label)}</div>`).join("")}
    ${V.rows.map(r => `<div class="row"><div class="bk"><div class="name" title="${esc(r.full || r.name)}">${esc(r.name)}</div><div class="sub">${esc(r.sub)}</div></div>
      ${matrixCells(r, r.cols || V.cols, sel, V.cols.length)}</div>`).join("")}
    </div></div>
    <div>${view === "drill" ? drPanel() : rgPanel()}</div></div>`;
  bind();
}
function matrixCells(r, cols, sel, width) {
  const xs = cols.map(c => r.cells[c.id] || {state: "not_run", line: ""});
  const what = x => String(x.line).split(" · ")[0];
  const same = cols.length > 1 && !["native", "healed"].includes(xs[0].state) && xs.every(x => x.state === xs[0].state && what(x) === what(xs[0]));
  const cell = (x, c, label, span) => `<button class="cell" data-b="${esc(r.id)}" data-v="${esc(c.id)}"${span ? ` style="grid-column:span ${span}"` : ""}
    aria-pressed="${!!sel && sel.b === r.id && (!!span || sel.v === c.id)}">${label ? `<div class="app">${esc(label)}</div>` : ""}${mark(x.state)}<div class="d">${esc(x.line)}</div></button>`;
  if (cols.length === 1 && width > 1) return cell(xs[0], cols[0], cols[0].label, width);
  return same ? cell({...xs[0], line: what(xs[0])}, cols[0], "", cols.length)
    : cols.map((c, i) => cell(xs[i], c, c.label)).join("");
}
function bind() {
  bindRun();
  document.querySelectorAll(".mk").forEach(el => { el.onfocus = el.onclick = () => ovPick(el.dataset.id); });
  document.querySelectorAll(".cell").forEach(el => el.onclick = async () => {
    const s = {b: el.dataset.b, v: el.dataset.v};
    if (view === "drill") dr.sel = s; else { rg.sel = s; await rgDetail(s.b).catch(e => note(e.message)); }
    draw();
    if (matchMedia("(max-width:900px)").matches) document.querySelector(".panel")?.scrollIntoView({behavior: "smooth"});
  });
  $("#rerun")?.addEventListener("click", async () => {
    const r = await fetch(`rg/api/backups/${encodeURIComponent(rg.sel.b)}/rerun`, {method: "POST"});
    note(r.ok ? "Queued." : `Not queued: ${await why(r)}`);
    rgRefresh();
  });
  $("#file")?.addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    note(`Uploading ${f.name}`);
    const r = await fetch(`api/uploads?name=${encodeURIComponent(f.name)}`, {method: "POST", body: f});
    if (!r.ok) { dr.upload = null; note(`Upload refused: ${await why(r)}`); }
    else { dr.upload = await r.json(); note(`${dr.upload.name} (${mb(dr.upload.bytes)}) joins the next drill as a fourth row.`); }
    draw();
  });
  $("#run")?.addEventListener("click", async () => {
    const r = await fetch(`api/runs/matrix${dr.upload ? "?upload=" + dr.upload.id : ""}`, {method: "POST"});
    if (!r.ok) { note(`Not started: ${await why(r)}`); return; }
    note(""); dr.sel = null; dr.upload = null; drFollow((await r.json()).run_id); draw();
  });
}
function setView(v, hash) {
  view = v; history.pushState(null, "", `?view=${v}${hash ? "#" + hash : ""}`); note(""); start(); scrollTo(0, 0);
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setView(b.dataset.view));
window.addEventListener("popstate", () => { view = viewFromUrl(); start(); });
window.addEventListener("hashchange", draw);
async function start() {
  draw();
  try {
    // Each engine loads once; switching views must not restart a drill's live stream.
    if (view === "drill" && !dr.proof && !dr.live) await drLoad();
    if (view !== "drill" && !rg.es) { await rgLoad(); rgStream(); }
    // Every backup's checks up front, so moving along the timeline never waits on the network.
    if (view === "overview") await Promise.all(rg.summaries.map(b => rgDetail(b.id).catch(() => {})));
  } catch (e) { note(view === "drill" ? `Drill results unavailable: ${e.message}` : `Backup watcher unavailable: ${e.message}`); }
  setLive(view === "drill" ? !!dr.es : !!rg.es);
  draw();
}
const viewFromUrl = () => ["drill", "backups"].includes(new URLSearchParams(location.search).get("view")) ? new URLSearchParams(location.search).get("view") : "overview";
view = viewFromUrl();
start();
</script>
</body>
</html>
